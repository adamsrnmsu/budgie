[project]
name = "Budgie"
version = "0.1.0"
description = "The Ultimate Project Budget Companion"
license = "MIT"
authors = [{name = "Ryan Adams", email = "adamsrnmsu@gmail.com"}]
# 3.10 is the real floor: itertools.pairwise (core/actuals.py) and
# zip(strict=True) (core/allocation.py) both arrived there.
requires-python = ">=3.10"

# Runtime only -- what the package imports. Test and lint tools are in `dev`.
dependencies = [
    "pyfiglet",
    "rich",
    "click",
    "pyyaml",
    "numpy",
    "holidays",
    "matplotlib",
    "textual",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.4",
    "pytest-asyncio",
    "isort",
    "ruff>=0.16.0",
]
# Builds the Sphinx site in docs/ (`make docs`).
docs = [
    "sphinx",
    "myst-parser",
    "furo",
    "sphinx-click",
]

[project.scripts]
budgie = "budgie.budgie:cli"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Pinned rather than left to setuptools' flat-layout auto-discovery, which
# scans the project root and treats any directory it finds as a candidate
# package. Budgie's own commands write output into the working directory --
# `budgie emails --out-dir emails` is in the README -- so running the tool in a
# checkout would otherwise make `pip install -e .` fail with "Multiple
# top-level packages discovered in a flat-layout: ['emails', 'budgie']".
include = ["budgie*"]

[tool.pytest.ini_options]
# Textual's App.run_test() is an async context manager, so the TUI tests are
# async. "auto" means they don't each need an @pytest.mark.asyncio decorator.
asyncio_mode = "auto"




[tool.ruff.lint]
# ruff's defaults (E4, E7, E9, F) plus the families the repo already leans on:
# ISC (see core/CLAUDE.md, ISC004) and DTZ (the DTZ005/007/011 noqa comments).
extend-select = ["ISC", "DTZ"]
