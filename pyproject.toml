[project]
name = "Budgie"
version = "0.1.0"
description = "The Ultimate Project Budget Companion"
authors = [{name = "Ryan Adams", email = "adamsrnmsu@gmail.com"}]

dependencies = [
    "pyfiglet",
    "rich",
    "black",
    "click",
    "pytest>=6.2.4",
    "isort",
    "ruff",
    "pyyaml",
    "numpy",
    "holidays",
    "matplotlib",
    "textual",
]

[project.scripts]
budgie = "budgie.budgie:cli"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"



