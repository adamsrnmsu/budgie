name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,docs]'
      - run: ruff check .
      - run: pytest
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
